# Alembic configuration - NFR-076.
#
# =========================================================================
# THIS FILE MUST STAY PURE ASCII.
# =========================================================================
# Alembic parses it with ConfigParser using the *locale* encoding, not UTF-8.
# On Windows that is cp1252, and a single non-ASCII character - an em dash, a
# section sign, an emoji - makes the whole file unreadable with a
# UnicodeDecodeError that names a byte offset and nothing else. It fails on the
# developer's machine while passing in CI, which runs UTF-8 Linux.
#
# The other files here are Python source and Mako templates, which are UTF-8 by
# specification, so they carry the usual annotated prose. This one cannot.
# `tests/test_migrations.py` asserts the constraint so it cannot regress.
#
# -------------------------------------------------------------------------
# SECURITY: there is deliberately NO `sqlalchemy.url` here. The connection
# string is a secret (NFR-034) and is read from `DATABASE_MIGRATION_URL` by
# `migrations/env.py`, through the same typed settings object the application
# uses (NFR-075).
#
# SECURITY: DB 2.4 - migrations connect as `app_migrator`, which holds DDL
# rights and is never used at runtime. The application connects as `app_user`,
# which has neither DDL nor BYPASSRLS. Two roles, two connection strings, one
# schema.
#
# WARNING: `ops/db/001_roles.sql` must have been run, and both passwords set,
# before the first `alembic upgrade head`. Alembic authenticates as
# `app_migrator` and cannot create the role it is connecting as.
#
# Usage (from backend/):
#   alembic upgrade head            apply migrations
#   alembic revision -m "message"   new revision  (--autogenerate once models exist)
#   alembic current                 which revision this database is on
#   alembic history                 the chain

[alembic]
script_location = migrations

# `backend/` on sys.path so `migrations/env.py` can import `app.platform.config`.
prepend_sys_path = .

# Migration filenames sort chronologically rather than by random revision id,
# so the directory reads as a history instead of a bag.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

version_path_separator = os

# WARNING: timezone-aware revision timestamps. Naive local time in a filename is
# ambiguous the moment a second machine runs a migration.
timezone = UTC

# Revision files are written as UTF-8 regardless of the platform's locale. The
# .ini itself cannot be, but everything Alembic generates from it can.
output_encoding = utf-8


# --- Logging -------------------------------------------------------------
# Deliberately minimal and separate from the application's JSON logging
# (`app.platform.logging`): migrations are an operator-facing CLI, not a request
# path, and their output is read by a human watching a deploy.
#
# SECURITY: `sqlalchemy.engine` stays at WARN. At INFO it echoes every
# statement, and a data migration's statements carry parameter values - i.e.
# clinical data (NFR-033).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
