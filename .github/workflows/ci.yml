# WellnessCRM V2 — continuous integration.
#
# 🔒 DoD §4.1 gate 1: "CI green: lint, types, boundary checker, tests, bundle
# budget, API-client freshness." Every one of those is a job or a step here.
#
# The pipeline exists at S0 rather than later because of Principle 8
# (Arch §1): scaffolding, boundaries and CI exist before module #1. A boundary
# rule that is not enforced on every push is a comment.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs make it possible to verify the pipeline on a scratch branch,
  # which is an explicit S0 testing-strategy item.
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  # A superseded run is wasted minutes on a free tier. Never cancel `main`,
  # because its result gates deployment.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 🔒 Least privilege (NFR-034). CI reads code; it does not write to the repo.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'   # 🔒 must match backend/pyproject.toml requires-python
  NODE_VERSION: '20'       # 🔒 must match frontend/package.json engines.node

jobs:
  # ─── Backend ───────────────────────────────────────────────────────────
  # DoD §4.1 gates 1: lint · types · tests. Boundaries run in their own job
  # so that "which rule failed" is visible from the job list alone.
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      # Each gate is its own step and none is allowed to short-circuit the
      # others: a formatting failure must not hide a type error, or the second
      # push only reveals the next problem.
      - name: Ruff format
        if: '!cancelled()'
        working-directory: backend
        run: ruff format --check .

      - name: Ruff lint
        if: '!cancelled()'
        working-directory: backend
        run: ruff check --output-format=github .

      - name: MyPy (strict)
        if: '!cancelled()'
        working-directory: backend
        run: mypy app tools

      - name: Pytest
        if: '!cancelled()'
        working-directory: backend
        run: pytest

      # 🔒 NFR-079, link ① of two. The committed OpenAPI document must match what
      # the code currently produces. The frontend job then checks that the
      # generated TypeScript matches that document (link ②) — it has no Python,
      # so the chain is deliberately split across the two jobs that each have the
      # toolchain for their half.
      - name: OpenAPI schema freshness
        if: '!cancelled()'
        working-directory: backend
        run: python tools/export_openapi.py --check

  # ─── Architectural boundaries ──────────────────────────────────────────
  # 🔒 Arch §3.5, and the S0 Definition of Done: this job failing is the
  # mechanism that makes the module boundaries real rather than aspirational.
  #
  # Separate from `backend` because it is the one check whose failure is an
  # architectural decision rather than a code defect, and because it needs both
  # trees — it checks Python imports *and* frontend dependencies (ADR-02).
  boundaries:
    name: Boundaries — Arch §3.5 R1–R8
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # 🔒 The boundary check runs FIRST, with nothing installed. The checker is
      # deliberately stdlib-only (ast + json, Arch §3.5) so it still works when
      # the dependency tree is broken — which is exactly when a boundary is most
      # likely to be crossed in a hurry. Running it before the install is what
      # keeps that guarantee honest: an accidental third-party import in the
      # checker fails here rather than going unnoticed.
      - name: Check boundaries
        working-directory: backend
        run: python tools/check_boundaries.py

      # The negative tests below need pytest, so the install happens after the
      # dependency-free check above has already passed.
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Verify the checker still fails on real violations
        working-directory: backend
        run: python -m pytest tests/test_boundaries.py -q
        # 🔒 A linter never seen to fail is indistinguishable from one that
        # cannot. The negative tests are part of the gate, not a nicety.

  # ─── Isolation gate ────────────────────────────────────────────────────
  # 🔒 AC-M0-003, the S1 sprint gate, plus DDR-15 audit immutability.
  #
  # Separate from `backend` for the same reason `boundaries` is: a failure here
  # is not a code defect, it is the tenancy model not holding, and that must be
  # legible from the job list alone.
  #
  # These suites need a database whose *roles* we control. `backend` runs without
  # one and they skip there; this job is where they actually execute.
  #
  # ⚠️ 🔒 **This job does not close DB §2.3.** There is no PgBouncer in front of
  # the service container, so it proves `SET LOCAL` isolation on a direct
  # connection — which was never the doubt. The launch gate is whether the
  # *Supabase pooler* runs in transaction mode, and that can only be confirmed
  # against a deployed environment. Do not read a green tick here as closing it.
  integration:
    name: Isolation gate — AC-M0-003 · DDR-15
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # 🔒 Pinned to match ops/db/docker-compose.yml. RLS semantics are exactly
        # what this job asserts, so the major version must not drift silently.
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: wellnesscrm_test
        ports:
          - 5432:5432
        # Without this the first psql races initdb — an intermittent red that
        # looks like a broken script rather than a startup ordering problem.
        options: >-
          --health-cmd "pg_isready -U postgres -d wellnesscrm_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # 🔒 The whole point of this job. With this set, a missing database turns
      # the suites into failures instead of skips — see
      # backend/tests/integration/conftest.py. A skip is green, so without this
      # the gate could quietly stop running and nothing would say so.
      REQUIRE_LIVE_DATABASE: '1'
      TEST_DB_PORT: '5432'   # the service maps to the default port, not 5433

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      # Roles → passwords → migrations → grant verification, in that order. The
      # ordering is load-bearing: `alembic upgrade head` connects as
      # `app_migrator` and revision 0003 issues `REVOKE ... FROM app_user`, so
      # both roles must exist before migrations run.
      #
      # ⚠️ Invoked via `bash`, not as `./provision-test-db.sh`. The script is
      # committed mode 100755, but it is authored on Windows where Git does not
      # track the executable bit — one `git add` from a workstation with
      # `core.filemode=false` silently drops it, and this job would then fail
      # with "permission denied" for a reason unrelated to anything it tests.
      - name: Provision database
        run: bash ops/db/provision-test-db.sh

      - name: Run the isolation and immutability gate
        working-directory: backend
        run: |
          eval "$(bash ../ops/db/provision-test-db.sh --export)"
          pytest tests/integration -v

      # 🔒 A gate that has never been seen to fail is indistinguishable from one
      # that cannot fail — the same argument the `boundaries` job makes for its
      # negative tests. Granting UPDATE back must make 002_verify_grants.sql
      # abort; if it exits 0 here, the script is not actually checking anything.
      - name: Verify the grant check still catches a re-granted UPDATE
        run: |
          PGPASSWORD=localdev psql "postgresql://postgres:localdev@localhost:5432/wellnesscrm_test" \
            -v ON_ERROR_STOP=1 -c 'GRANT UPDATE ON TABLE audit_log TO app_user'
          if PGPASSWORD=localdev psql "postgresql://postgres:localdev@localhost:5432/wellnesscrm_test" \
               -v ON_ERROR_STOP=1 -f ops/db/002_verify_grants.sql; then
            echo '::error::002_verify_grants.sql passed with UPDATE granted on audit_log. The DDR-15 check is inert.'
            exit 1
          fi
          echo 'Grant check correctly rejected the re-granted UPDATE.'

      # Proves the migration chain reverses cleanly, so a bad deploy can be
      # rolled back. Runs last because it destroys the schema above.
      - name: Migration round-trip — downgrade to base and re-apply
        working-directory: backend
        env:
          DATABASE_MIGRATION_URL: postgresql+psycopg://app_migrator:localdev@localhost:5432/wellnesscrm_test
          DATABASE_URL: postgresql+psycopg://app_user:localdev@localhost:5432/wellnesscrm_test
        run: |
          alembic downgrade base
          alembic upgrade head

  # ─── Frontend ──────────────────────────────────────────────────────────
  # DoD §4.1: lint · types · build · bundle budget · API-client freshness.
  #
  # ⚠️ The frontend workspace is scaffolded later in S0 (design system, three
  # app shells). Until then `frontend/packages/*` and `frontend/apps/*` are
  # empty, there is no lockfile, and these commands have nothing to act on.
  #
  # The job therefore detects whether the workspace exists and skips its steps
  # if it does not, rather than being commented out or hard-coded to pass. It
  # starts enforcing automatically on the commit that adds the first workspace
  # package — no one has to remember to switch it on. The `scaffolded` output
  # is reported in the summary either way, so "skipped" is never silent.
  frontend:
    name: Frontend — lint, types, build, budget
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Detect workspace state
        id: detect
        run: |
          shopt -s nullglob
          packages=(frontend/packages/*/package.json frontend/apps/*/package.json)
          if (( ${#packages[@]} > 0 )); then
            echo 'scaffolded=true' >> "$GITHUB_OUTPUT"
            echo "Found ${#packages[@]} workspace package(s); frontend gates will run."
          else
            echo 'scaffolded=false' >> "$GITHUB_OUTPUT"
            echo 'No workspace packages yet; frontend gates are inactive.'
          fi

          if [[ -f frontend/package-lock.json ]]; then
            echo 'lockfile=true' >> "$GITHUB_OUTPUT"
          else
            echo 'lockfile=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.detect.outputs.scaffolded == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.detect.outputs.lockfile == 'true' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      # 🔒 `npm ci` once a lockfile exists: reproducible installs (NFR-040).
      # `npm install` is tolerated only for the first commits after scaffolding,
      # before the lockfile is committed.
      - name: Install
        if: steps.detect.outputs.scaffolded == 'true'
        working-directory: frontend
        run: |
          if [[ '${{ steps.detect.outputs.lockfile }}' == 'true' ]]; then
            npm ci
          else
            echo '::warning::No package-lock.json — falling back to `npm install`. Commit the lockfile (NFR-040).'
            npm install --no-audit --no-fund
          fi

      - name: ESLint
        if: steps.detect.outputs.scaffolded == 'true' && !cancelled()
        working-directory: frontend
        run: npm run lint

      - name: TypeScript
        if: steps.detect.outputs.scaffolded == 'true' && !cancelled()
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        if: steps.detect.outputs.scaffolded == 'true' && !cancelled()
        working-directory: frontend
        run: npm run build

      - name: Test
        if: steps.detect.outputs.scaffolded == 'true' && !cancelled()
        working-directory: frontend
        run: npm test

      # 🔒 NFR-002 — ≤2.5s on 4G. A budget checked only at launch is a budget
      # already blown; the regression is cheap to fix on the commit that causes
      # it and expensive three months later.
      - name: Bundle budget
        if: steps.detect.outputs.scaffolded == 'true' && !cancelled()
        working-directory: frontend
        run: node scripts/check-bundle-budget.mjs

      # 🔒 NFR-079, link ② of two — `packages/api-client` is build output. If the
      # committed client does not match the OpenAPI schema, the frontend is
      # compiling against a contract that no longer exists.
      #
      # Link ① (schema matches the backend code) runs in the `backend` job,
      # which has Python. Neither check is sufficient alone; together they make
      # a contract change break the build rather than production.
      - name: API client freshness
        if: steps.detect.outputs.scaffolded == 'true' && !cancelled()
        working-directory: frontend
        run: node scripts/check-client-freshness.mjs

  # ─── Aggregate gate ────────────────────────────────────────────────────
  # One required status check for branch protection. Without this, adding a job
  # means remembering to add it to the protected-branch list, and a job that is
  # not required is a job that can fail unnoticed.
  ci:
    name: CI
    if: always()
    needs: [backend, boundaries, integration, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify every job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for result in $results; do
            if [[ "$result" != 'success' ]]; then
              echo '::error::A required CI job did not succeed.'
              exit 1
            fi
          done
          echo 'All CI gates passed.'
